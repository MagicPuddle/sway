<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>MagicPuddle OS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a1a;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            height: 100vh;
            color: #fff;
        }

        .neon-text {
            font-size: 48px;
            text-align: center;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc, 0 0 30px #00ccff, 0 0 40px #ff00ff;
            animation: neon 1.5s ease-in-out infinite alternate;
        }

        h1 {
            margin-top: 20vh;
            font-size: 72px;
            color: #fff;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: glow 1.5s ease-in-out infinite alternate;
        }

        .glow {
            text-shadow: 0 0 15px #ff0080, 0 0 30px #ff0080, 0 0 45px #ff0080;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100%;
        }

        .neon-button {
            padding: 15px 30px;
            margin-top: 20px;
            border: 2px solid #00ffcc;
            border-radius: 8px;
            background-color: transparent;
            color: #00ffcc;
            font-size: 18px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
            box-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
        }

        .neon-button:hover {
            background-color: #00ffcc;
            color: #1a1a1a;
            box-shadow: 0 0 30px #00ffcc, 0 0 60px #00ffcc, 0 0 90px #00ffcc;
        }

        @keyframes glow {
            0% {
                text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 30px #ff00ff, 0 0 40px #ff00ff;
            }
            100% {
                text-shadow: 0 0 10px #00ccff, 0 0 20px #00ccff, 0 0 30px #00ccff, 0 0 40px #00ccff;
            }
        }

        @keyframes neon {
            0% {
                text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc, 0 0 30px #00ffcc, 0 0 40px #00ffcc;
            }
            100% {
                text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 30px #ff00ff, 0 0 40px #ff00ff;
            }
        }

        .neon-box {
            margin-top: 50px;
            width: 300px;
            height: 200px;
            border: 2px solid #ff00ff;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 12px;
            box-shadow: 0 0 15px #ff00ff, 0 0 30px #ff00ff;
            animation: neon-box 1.5s ease-in-out infinite alternate;
        }

        @keyframes neon-box {
            0% {
                box-shadow: 0 0 15px #ff00ff, 0 0 30px #ff00ff;
            }
            100% {
                box-shadow: 0 0 20px #00ccff, 0 0 40px #00ccff;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="glow">Welcome to MagicPuddle OS</h1>
        <div class="neon-text">A Futuristic Experience</div>
        <button class="neon-button">Get Started</button>
        <div class="neon-box"></div>
    </div>
</body>
</html>
